name: Automated Quant 24/7 Scan

on:
  schedule:
    # Draait automatisch elke 15 minuten
    - cron: '*/15 * * * *'
  workflow_dispatch: Allows manual triggering from GitHub

jobs:
  run-quant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance xgboost scikit-learn requests

      - name: Run Quant Worker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python quant_worker.py

name: Automated Quant ML Training

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance xgboost scikit-learn

      - name: Run Background ML Trainer
        run: |
          python quant_worker.py

      - name: Commit and push model updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add model_*.json
          git diff --staged --quiet || git commit -m "Auto-update trained ML models [skip ci]"
          git push
